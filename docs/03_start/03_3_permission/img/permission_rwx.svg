<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f8fafc; }
    .box { stroke-width: 2px; rx: 6px; }
    
    .bg-read { fill: #fef2f2; stroke: #ef4444; }
    .bg-write { fill: #eff6ff; stroke: #3b82f6; }
    .bg-exec { fill: #f0fdf4; stroke: #10b981; }
    
    .text-title { fill: #0f172a; font-family: sans-serif; font-weight: bold; font-size: 24px; text-anchor: middle; }
    .text-main { fill: #1e293b; font-family: sans-serif; font-weight: bold; font-size: 20px; text-anchor: middle; alignment-baseline: middle; }
    .text-val { fill: #475569; font-family: sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
    .text-desc { fill: #64748b; font-family: sans-serif; font-size: 13px; text-anchor: middle; }
  </style>

  <rect width="100%" height="100%" class="bg" rx="15" />
  <text x="400" y="40" class="text-title">리눅스 3단계 접근 권한(Permission) 계산기 표</text>
  
  <!-- Outer Wrapper for User / Group / Others -->
  <g transform="translate(100, 100)">
    
    <text x="-40" y="45" font-family="sans-serif" font-weight="bold" font-size="16px">소유자</text>
    <text x="-40" y="70" font-family="sans-serif" font-size="14px" fill="#ef4444">(User)</text>
    
    <!-- User block -->
    <rect x="30" y="0" width="80" height="100" class="box bg-read" />
    <text x="70" y="30" class="text-main" fill="#b91c1c">r</text>
    <text x="70" y="55" class="text-val">4</text>
    <text x="70" y="80" class="text-desc">읽기</text>

    <rect x="120" y="0" width="80" height="100" class="box bg-write" />
    <text x="160" y="30" class="text-main" fill="#1d4ed8">w</text>
    <text x="160" y="55" class="text-val">2</text>
    <text x="160" y="80" class="text-desc">쓰기</text>

    <rect x="210" y="0" width="80" height="100" class="box bg-exec" />
    <text x="250" y="30" class="text-main" fill="#047857">x</text>
    <text x="250" y="55" class="text-val">1</text>
    <text x="250" y="80" class="text-desc">실행</text>
    
    <!-- Bracket Sum -->
    <text x="160" y="140" class="text-main" fill="#ef4444">합계: 7</text>
  </g>

  <!-- Group block -->
  <g transform="translate(420, 100)">
    <text x="-30" y="45" font-family="sans-serif" font-weight="bold" font-size="16px">그룹</text>
    <text x="-30" y="70" font-family="sans-serif" font-size="14px" fill="#3b82f6">(Group)</text>
    
    <!-- r - x -->
    <rect x="30" y="0" width="80" height="100" class="box bg-read" />
    <text x="70" y="30" class="text-main" fill="#b91c1c">r</text>
    <text x="70" y="55" class="text-val">4</text>
    <text x="70" y="80" class="text-desc">읽기</text>

    <rect x="120" y="0" width="80" height="100" class="box" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="160" y="30" class="text-main" fill="#94a3b8">-</text>
    <text x="160" y="55" class="text-val" fill="#94a3b8">0</text>
    <text x="160" y="80" class="text-desc">없음</text>

    <rect x="210" y="0" width="80" height="100" class="box bg-exec" />
    <text x="250" y="30" class="text-main" fill="#047857">x</text>
    <text x="250" y="55" class="text-val">1</text>
    <text x="250" y="80" class="text-desc">실행</text>
    
    <text x="160" y="140" class="text-main" fill="#3b82f6">합계: 5</text>
  </g>

  <!-- Divider Output -->
  <rect x="150" y="300" width="500" height="80" fill="#1e293b" rx="8" />
  <text x="400" y="335" fill="white" font-family="monospace" font-size="20px" font-weight="bold" text-anchor="middle">
    결과 표기: <tspan fill="#fca5a5">rwxr-x---</tspan> (750)
  </text>
  <text x="400" y="360" fill="#94a3b8" font-family="sans-serif" font-size="13px" text-anchor="middle">
    숫자로 다 더해서 표기 시 "750 권한을 준다"고 표현합니다.
  </text>

</svg>
