<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f8fafc; }
    .box { rx: 10px; }
    .stable { fill: #10b981; }
    .mainline { fill: #f59e0b; }
    .prepatch { fill: #ef4444; }
    
    .title { fill: #1e293b; font-family: sans-serif; font-weight: bold; font-size: 24px; text-anchor: middle; }
    .text-main { fill: white; font-family: sans-serif; font-weight: bold; font-size: 18px; text-anchor: middle; alignment-baseline: middle; }
    .text-sub { fill: white; font-family: sans-serif; font-size: 13px; text-anchor: middle; }
    
    .arrow {
      stroke: #64748b;
      stroke-width: 4px;
      fill: none;
      stroke-dasharray: 6;
      animation: dash 2s linear infinite;
    }

    @keyframes dash {
      to { stroke-dashoffset: -12; }
    }
    
    .pop {
      animation: pop 3s infinite ease-in-out;
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes pop {
      0% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.05); filter: brightness(1.2); }
      100% { transform: scale(1); filter: brightness(1); }
    }
    
    .version-tag { fill: #334155; font-family: monospace; font-size: 14px; font-weight:bold; }
  </style>

  <rect width="100%" height="100%" class="bg" rx="15" />
  <text x="400" y="40" class="title">리눅스 커널(Kernel) 배포 트리의 진화 구조</text>
  
  <!-- Flow lines connecting boxes -->
  <path d="M 600 200 L 400 200 L 200 200" class="arrow" />
  
  <g class="pop" style="animation-delay: 0s;" transform="translate(600, 200)">
    <rect x="-80" y="-50" width="160" height="100" class="box mainline" />
    <text x="0" y="-15" class="text-main">메인라인 버전</text>
    <text x="0" y="10" class="text-sub">(Mainline)</text>
    <text x="0" y="30" class="text-sub" style="font-size:11px;">리누스 토르발스 직접 관리</text>
  </g>

  <g class="pop" style="animation-delay: 0.5s;" transform="translate(400, 200)">
    <rect x="-80" y="-50" width="160" height="100" class="box prepatch" />
    <text x="0" y="-15" class="text-main">프리패치 버전</text>
    <text x="0" y="10" class="text-sub">(RC / Prepatch)</text>
    <text x="0" y="30" class="text-sub" style="font-size:11px;">출시 직전 테스트/버그수정</text>
  </g>

  <g class="pop" style="animation-delay: 1.0s;" transform="translate(200, 200)">
    <rect x="-80" y="-50" width="160" height="100" class="box stable" />
    <text x="0" y="-15" class="text-main">안정화 버전</text>
    <text x="0" y="10" class="text-sub">(Stable Version)</text>
    <text x="0" y="30" class="text-sub" style="font-size:11px;">기업용 서버에 즉각 배포됨</text>
  </g>

  <!-- Explanation box for Major.Minor.Patch -->
  <rect x="250" y="290" width="300" height="80" fill="white" stroke="#cbd5e1" rx="8" />
  <text x="400" y="315" class="text-main" style="fill:#0f172a;">버전 구성 예시: 5.1.15</text>
  <text x="400" y="340" class="version-tag">
    <tspan fill="#dc2626">5</tspan> (주버전) . <tspan fill="#2563eb">1</tspan> (부버전) . <tspan fill="#059669">15</tspan> (패치)
  </text>
  
</svg>
