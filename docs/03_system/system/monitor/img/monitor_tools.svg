<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f8fafc; }
    .box { fill: white; stroke-width: 2px; rx: 8px; stroke: #94a3b8; }
    
    .head { fill: #0f172a; font-family: sans-serif; font-weight: bold; font-size: 24px; text-anchor: middle; }
    .title { fill: white; font-family: sans-serif; font-weight: bold; font-size: 16px; text-anchor: middle; }
    .cmd { fill: #1e293b; font-family: monospace; font-size: 20px; font-weight: bold; text-anchor: middle; }
    .desc { fill: #64748b; font-family: sans-serif; font-size: 13px; text-anchor: middle; }
  </style>

  <rect width="100%" height="100%" class="bg" rx="15" />
  <text x="400" y="40" class="head">리눅스 3대 핵심 모니터링(Monitoring) 진단 도구</text>

  <!-- CPU/RAM -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="180" height="200" class="box" stroke="#ef4444" />
    <rect x="0" y="0" width="180" height="40" rx="6" fill="#ef4444" />
    <text x="90" y="26" class="title">CPU / RAM(메모리)</text>
    
    <text x="90" y="80" class="cmd" fill="#b91c1c">top</text>
    
    <rect x="15" y="100" width="150" height="80" fill="#fef2f2" rx="4" />
    <text x="90" y="125" class="desc">실시간 프로세스 점유율</text>
    <text x="90" y="145" class="desc">윈도우 작업관리자 호환</text>
    <text x="90" y="165" class="desc" fill="#991b1b" font-weight="bold">에러 시: 서버 느려짐/멈춤</text>
  </g>

  <!-- DISK -->
  <g transform="translate(310, 100)">
    <rect x="0" y="0" width="180" height="200" class="box" stroke="#eab308" />
    <rect x="0" y="0" width="180" height="40" rx="6" fill="#eab308" />
    <text x="90" y="26" class="title">디스크 용량 (Storage)</text>
    
    <text x="90" y="80" class="cmd" fill="#a16207">df -h</text>
    
    <rect x="15" y="100" width="150" height="80" fill="#fefce8" rx="4" />
    <text x="90" y="125" class="desc">로그 파일 누적량 검사</text>
    <text x="90" y="145" class="desc">파티션별 남은 용량 체크</text>
    <text x="90" y="165" class="desc" fill="#854d0e" font-weight="bold">에러 시: DB 파일 쓰기 실패</text>
  </g>

  <!-- Network -->
  <g transform="translate(540, 100)">
    <rect x="0" y="0" width="180" height="200" class="box" stroke="#3b82f6" />
    <rect x="0" y="0" width="180" height="40" rx="6" fill="#3b82f6" />
    <text x="90" y="26" class="title">네트워크 통신망</text>
    
    <text x="90" y="80" class="cmd" fill="#1d4ed8">netstat</text>
    
    <rect x="15" y="100" width="150" height="80" fill="#eff6ff" rx="4" />
    <text x="90" y="125" class="desc">서버 열려있는 포트 검사</text>
    <text x="90" y="145" class="desc">현재 접속중인 해커 IP 추적</text>
    <text x="90" y="165" class="desc" fill="#1e40af" font-weight="bold">에러 시: 사이트 접속 불가</text>
  </g>

</svg>
