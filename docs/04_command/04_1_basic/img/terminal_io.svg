<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f8fafc; }
    .window { fill: #1e293b; rx: 8px; stroke: #334155; stroke-width: 4px; }
    .window-header { fill: #334155; }
    .btn-red { fill: #ef4444; }
    .btn-yel { fill: #f59e0b; }
    .btn-grn { fill: #10b981; }
    
    .text-title { fill: #0f172a; font-family: sans-serif; font-weight: bold; font-size: 24px; text-anchor: middle; }
    .terminal-font { font-family: "Courier New", Courier, monospace; font-size: 16px; font-weight: bold; }
    .prompt { fill: #10b981; }
    .input { fill: #f8fafc; }
    .output { fill: #94a3b8; }
  </style>

  <rect width="100%" height="100%" class="bg" rx="15" />
  <text x="400" y="40" class="text-title">터미널(Terminal) 명령어 입출력 인터페이스 구조</text>
  
  <!-- Terminal Window Background -->
  <g transform="translate(100, 70)">
    <rect x="0" y="0" width="600" height="240" class="window" />
    
    <!-- Top Bar -->
    <rect x="0" y="0" width="600" height="30" class="window-header" />
    <circle cx="20" cy="15" r="6" class="btn-red" />
    <circle cx="40" cy="15" r="6" class="btn-yel" />
    <circle cx="60" cy="15" r="6" class="btn-grn" />
    <text x="300" y="20" fill="white" font-family="sans-serif" font-size="12px" text-anchor="middle">user@server: ~</text>

    <!-- Terminal Text Content -->
    <!-- Interaction 1 -->
    <text x="20" y="65" class="terminal-font">
      <tspan class="prompt">user@server:~$</tspan> <tspan class="input">whoami</tspan>
    </text>
    <text x="20" y="85" class="terminal-font output">user</text>

    <!-- Interaction 2 -->
    <text x="20" y="125" class="terminal-font">
      <tspan class="prompt">user@server:~$</tspan> <tspan class="input">pwd</tspan>
    </text>
    <text x="20" y="145" class="terminal-font output">/home/user</text>

    <!-- Interaction 3 -->
    <text x="20" y="185" class="terminal-font">
      <tspan class="prompt">user@server:~$</tspan> <tspan class="input">ls -l</tspan>
    </text>
    <text x="20" y="205" class="terminal-font output">drwxr-xr-x 2 user user 4096 Apr 13 14:00 Desktop</text>
    
    <!-- Cursor Block -->
    <rect x="145" y="215" width="10" height="18" fill="#10b981" />
    <text x="20" y="230" class="terminal-font prompt">user@server:~$</text>
  </g>
</svg>
