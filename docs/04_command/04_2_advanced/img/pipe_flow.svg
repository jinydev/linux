<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f8fafc; }
    .box { fill: white; stroke: #3b82f6; stroke-width: 3px; rx: 8px; }
    
    .head { fill: #0f172a; font-family: sans-serif; font-weight: bold; font-size: 24px; text-anchor: middle; }
    .cmd { fill: #0f172a; font-family: monospace; font-size: 20px; font-weight: bold; text-anchor: middle; }
    .desc { fill: #64748b; font-family: sans-serif; font-size: 13px; text-anchor: middle; }
    .doc-text { fill: #10b981; font-family: monospace; font-size: 14px; font-weight: bold; text-anchor: middle; }

    .arrow { stroke: #eab308; stroke-width: 8px; fill: none; }
  </style>

  <rect width="100%" height="100%" class="bg" rx="15" />
  <text x="400" y="40" class="head">파이프(Pipe) 데이터 연결 파이프라인 구조도</text>

  <!-- Left: Command 1 (ls -l) -->
  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="160" height="90" class="box" />
    <text x="80" y="35" class="cmd">ls -l</text>
    <text x="80" y="65" class="desc">폴더 내 100만 개의</text>
    <text x="80" y="80" class="desc">파일 리스트 출력</text>
  </g>

  <!-- Middle: Pipe Symbol and data flow -->
  <g transform="translate(280, 120)">
    <path d="M -10 45 L 80 45" class="arrow" />
    <polygon points="80,45 65,35 65,55" fill="#eab308" />

    <text x="35" y="20" class="doc-text">파이프라인 넘김</text>
    
    <rect x="90" y="10" width="60" height="70" fill="#fef08a" rx="4" />
    <text x="120" y="55" class="head" style="font-size: 36px; fill: #ca8a04;">|</text>

    <path d="M 160 45 L 230 45" class="arrow" />
    <polygon points="230,45 215,35 215,55" fill="#eab308" />
  </g>

  <!-- Right: Command 2 (grep) -->
  <g transform="translate(530, 120)">
    <rect x="0" y="0" width="160" height="90" class="box" stroke="#10b981" />
    <text x="80" y="35" class="cmd">grep ".txt"</text>
    <text x="80" y="65" class="desc">넘겨받은 데이터 중</text>
    <text x="80" y="80" class="desc">.txt 파일만 걸러냄</text>
  </g>

  <rect x="150" y="270" width="500" height="40" fill="#1e293b" rx="4" />
  <text x="400" y="295" fill="white" font-family="monospace" font-weight="bold" font-size="16px" text-anchor="middle">
    터미널 입력: ls -l <tspan fill="#fef08a">|</tspan> grep ".txt"
  </text>

</svg>
