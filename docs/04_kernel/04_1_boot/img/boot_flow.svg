<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f3f4f6; rx: 12px; }
    .stage-box { fill: white; stroke: #cbd5e1; stroke-width: 2px; rx: 6px; }
    .stage-text { fill: #1e293b; font-family: sans-serif; font-weight: bold; font-size: 16px; text-anchor: middle; alignment-baseline: middle; }
    .desc-text { fill: #64748b; font-family: sans-serif; font-size: 12px; text-anchor: middle; }
    
    .arrow {
      stroke: #3b82f6;
      stroke-width: 4px;
      fill: none;
      stroke-dasharray: 6;
      animation: dash 1.5s linear infinite;
    }

    @keyframes dash {
      to { stroke-dashoffset: -12; }
    }

    .pulse {
      animation: pulse 2s infinite ease-in-out;
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes pulse {
      0% { transform: scale(1); border-color: #cbd5e1; }
      50% { transform: scale(1.05); stroke: #3b82f6; }
      100% { transform: scale(1); border-color: #cbd5e1; }
    }
    
    .title { fill: #0f172a; font-family: sans-serif; font-size: 24px; font-weight: bold; text-anchor: middle; }
  </style>

  <rect width="100%" height="100%" class="bg" />
  <text x="400" y="40" class="title">리눅스 시스템 부팅 절차 (Boot Sequence)</text>

  <!-- Level 1: BIOS -->
  <g class="pulse" style="animation-delay: 0s;" transform="translate(100, 100)">
    <rect x="-70" y="0" width="140" height="60" class="stage-box" />
    <text x="0" y="25" class="stage-text">1. BIOS / UEFI</text>
    <text x="0" y="45" class="desc-text">하드웨어 초기화</text>
  </g>

  <!-- Arrow -->
  <path d="M 170 130 L 230 130" class="arrow" />
  <polygon points="230,130 220,124 220,136" fill="#3b82f6" />

  <!-- Level 2: Boot Loader -->
  <g class="pulse" style="animation-delay: 0.5s;" transform="translate(300, 100)">
    <rect x="-70" y="0" width="140" height="60" class="stage-box" />
    <text x="0" y="25" class="stage-text">2. Boot Loader</text>
    <text x="0" y="45" class="desc-text">GRUB (커널 선택)</text>
  </g>

  <!-- Arrow -->
  <path d="M 370 130 L 430 130" class="arrow" />
  <polygon points="430,130 420,124 420,136" fill="#3b82f6" />

  <!-- Level 3: Kernel -->
  <g class="pulse" style="animation-delay: 1.0s;" transform="translate(500, 100)">
    <rect x="-70" y="0" width="140" height="60" class="stage-box" />
    <text x="0" y="25" class="stage-text">3. OS Kernel</text>
    <text x="0" y="45" class="desc-text">메모리 및 루트 마운트</text>
  </g>
  
  <!-- Arrow to next row -->
  <path d="M 570 130 L 630 130 L 630 250 L 570 250" class="arrow" />
  <polygon points="570,250 580,244 580,256" fill="#3b82f6" />

  <!-- Level 4: Init Process -->
  <g class="pulse" style="animation-delay: 1.5s;" transform="translate(500, 220)">
    <rect x="-70" y="0" width="140" height="60" class="stage-box" />
    <text x="0" y="25" class="stage-text">4. init / systemd</text>
    <text x="0" y="45" class="desc-text">최초의 데몬 구동</text>
  </g>

  <!-- Arrow -->
  <path d="M 430 250 L 370 250" class="arrow" />
  <polygon points="370,250 380,244 380,256" fill="#3b82f6" />

  <!-- Level 5: Runlevel -->
  <g class="pulse" style="animation-delay: 2.0s;" transform="translate(300, 220)">
    <rect x="-70" y="0" width="140" height="60" class="stage-box" />
    <text x="0" y="25" class="stage-text">5. Runlevel 지정</text>
    <text x="0" y="45" class="desc-text">CLI 모드 / GUI 모드 설정</text>
  </g>

  <!-- Arrow -->
  <path d="M 230 250 L 170 250" class="arrow" />
  <polygon points="170,250 180,244 180,256" fill="#3b82f6" />

  <!-- Level 6: Login -->
  <g class="pulse" style="animation-delay: 2.5s;" transform="translate(100, 220)">
    <rect x="-70" y="0" width="140" height="60" class="stage-box" style="stroke: #10b981; fill: #ecfdf5;" />
    <text x="0" y="25" class="stage-text" style="fill: #047857;">6. Login 화면</text>
    <text x="0" y="45" class="desc-text" style="fill: #059669;">부팅 완료 &amp; 사용자 입력</text>
  </g>

</svg>
