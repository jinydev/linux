<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f8fafc; }
    .box { fill: white; stroke-width: 2px; rx: 8px; }
    
    .head { fill: #0f172a; font-family: sans-serif; font-weight: bold; font-size: 24px; text-anchor: middle; }
    .title { fill: white; font-family: sans-serif; font-weight: bold; font-size: 18px; text-anchor: middle; }
    .txt { fill: #475569; font-family: monospace; font-size: 15px; font-weight: bold; text-anchor: middle; }
    
    .red-box { stroke: #ef4444; }
    .green-box { stroke: #10b981; }
    
    .arrow { stroke: #94a3b8; stroke-width: 4px; fill: none; stroke-dasharray: 5; }
    .pkt { stroke: #334155; fill: #f1f5f9; stroke-width: 1px; rx: 4px; }
  </style>

  <rect width="100%" height="100%" class="bg" rx="15" />
  <text x="400" y="40" class="head">서버 원격 접속 프로토콜 안전성 비교 (Telnet vs SSH)</text>

  <!-- Left: Client -->
  <g transform="translate(50, 150)">
    <rect x="0" y="0" width="80" height="80" class="box" stroke="#334155" />
    <text x="40" y="35" class="txt" style="font-size: 12px">내 컴퓨터</text>
    <text x="40" y="55" class="txt" style="font-size: 12px">(Client)</text>
  </g>

  <!-- Right: Server -->
  <g transform="translate(670, 150)">
    <rect x="0" y="0" width="80" height="80" class="box" fill="#1e293b" />
    <text x="40" y="35" class="txt" fill="white" style="font-size: 12px">타겟 리눅스</text>
    <text x="40" y="55" class="txt" fill="#94a3b8" style="font-size: 12px">(Server)</text>
  </g>

  <!-- Top Path: Telnet -->
  <g transform="translate(200, 100)">
    <path d="M -70 40 L 470 40" class="arrow" stroke="#ef4444" />
    <polygon points="465,40 450,30 450,50" fill="#ef4444" />
    
    <rect x="150" y="0" width="100" height="30" class="red-box" fill="#fee2e2" />
    <text x="200" y="20" class="txt" fill="#b91c1c">Telnet 평문</text>
    
    <!-- Hacker intercepting -->
    <rect x="160" y="55" width="80" height="30" class="pkt" stroke="#ef4444" />
    <text x="200" y="75" class="txt" fill="#ef4444" font-size="12px">해커 노출!</text>
    <path d="M 200 40 L 200 55" stroke="#ef4444" stroke-width="2" />
    
    <text x="200" y="-10" class="txt" fill="#ef4444" font-size="12px">비밀번호 그대로 전송 (위험)</text>
  </g>

  <!-- Bottom Path: SSH -->
  <g transform="translate(200, 240)">
    <path d="M -70 40 L 470 40" class="arrow" stroke="#10b981" stroke-dasharray="none" />
    <polygon points="465,40 450,30 450,50" fill="#10b981" />
    
    <rect x="150" y="0" width="100" height="30" class="green-box" fill="#d1fae5" />
    <text x="200" y="20" class="txt" fill="#047857">SSH 암호화</text>
    
    <!-- Encrypted packet -->
    <rect x="160" y="55" width="80" height="30" class="pkt" stroke="#10b981" />
    <text x="200" y="75" class="txt" fill="#047857" font-size="12px">암호화됨</text>
    
    <text x="200" y="-10" class="txt" fill="#047857" font-size="12px">RSA/Ed25519 인증서 철통 보안</text>
  </g>

</svg>
