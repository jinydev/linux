<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f8fafc; }
    .box { fill: white; stroke-width: 2px; rx: 8px; stroke: #94a3b8; }
    
    .head { fill: #0f172a; font-family: sans-serif; font-weight: bold; font-size: 24px; text-anchor: middle; }
    .txt { fill: #1e293b; font-family: sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
    
    .client { stroke: #3b82f6; fill: #eff6ff; }
    .server { stroke: #eab308; fill: #fefce8; }
    
    .arrow { stroke: #94a3b8; stroke-width: 4px; fill: none; }
  </style>

  <rect width="100%" height="100%" class="bg" rx="15" />
  <text x="400" y="40" class="head">MySQL 플랫폼 (Client - Server) 3306 아키텍처</text>

  <!-- Client Side Box -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="180" height="180" class="box client" />
    <text x="90" y="30" class="txt" fill="#1d4ed8">MySQL 클라이언트</text>
    
    <rect x="20" y="50" width="140" height="30" fill="#3b82f6" rx="4" />
    <text x="90" y="70" fill="white" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">CLI (터미널 명령어)</text>
    
    <rect x="20" y="90" width="140" height="30" fill="#3b82f6" rx="4" />
    <text x="90" y="110" fill="white" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">MySQL WorkBench</text>

    <rect x="20" y="130" width="140" height="30" fill="#3b82f6" rx="4" />
    <text x="90" y="150" fill="white" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">DBeaver / HeidiSQL</text>
  </g>

  <!-- Communication Arrows -->
  <path d="M 280 160 L 510 160" class="arrow" stroke="#0f172a" stroke-dasharray="6" />
  <polygon points="510,160 495,150 495,170" fill="#0f172a" />
  <path d="M 510 200 L 280 200" class="arrow" stroke="#0f172a" stroke-dasharray="6" />
  <polygon points="280,200 295,190 295,210" fill="#0f172a" />
  
  <text x="395" y="145" fill="#1e293b" font-family="monospace" font-weight="bold" text-anchor="middle">SQL 질의어 (Query)</text>
  <text x="395" y="235" fill="#1e293b" font-family="monospace" font-weight="bold" text-anchor="middle">TCP Port: 3306</text>

  <!-- Server Side Box -->
  <g transform="translate(520, 100)">
    <rect x="0" y="0" width="180" height="180" class="box server" />
    <text x="90" y="30" class="txt" fill="#a16207">MySQL 엔진 (서버)</text>
    
    <rect x="20" y="50" width="140" height="50" fill="#eab308" rx="4" />
    <text x="90" y="70" fill="white" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">mysqld 데몬</text>
    <text x="90" y="90" fill="#fefce8" font-family="sans-serif" font-size="10px" text-anchor="middle">(백그라운드 회전)</text>
    
    <rect x="20" y="120" width="140" height="40" fill="#ca8a04" rx="4" />
    <text x="90" y="145" fill="white" font-family="sans-serif" font-size="14px" font-weight="bold" text-anchor="middle">실제 데이터베이스</text>
  </g>

</svg>
