<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f8fafc; }
    .box { fill: white; stroke-width: 2px; rx: 8px; stroke: #cbd5e1; }
    
    .head { fill: #0f172a; font-family: sans-serif; font-weight: bold; font-size: 24px; text-anchor: middle; }
    .title { fill: white; font-family: sans-serif; font-weight: bold; font-size: 16px; text-anchor: middle; }
    .name { fill: #1e293b; font-family: monospace; font-size: 16px; font-weight: bold; text-anchor: middle; }
    .desc { fill: #64748b; font-family: sans-serif; font-size: 12px; text-anchor: middle; }
  </style>

  <rect width="100%" height="100%" class="bg" rx="15" />
  <text x="400" y="40" class="head">클라이언트 - 웹/WAS - 데이터베이스 3계층 (3-Tier) 아키텍처</text>

  <!-- Tier 1: Client -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="160" height="200" class="box" />
    <rect x="0" y="0" width="160" height="35" rx="6" fill="#64748b" />
    <text x="80" y="23" class="title">1 Tier: Presentation</text>
    
    <text x="80" y="70" class="name">클라이언트</text>
    <text x="80" y="90" class="desc">(Web Browser)</text>
    
    <rect x="10" y="110" width="140" height="60" fill="#f1f5f9" rx="4" />
    <text x="80" y="130" class="desc">PC 크롬 / 앱 화면</text>
    <text x="80" y="150" class="desc">HTML/CSS 디자인</text>
  </g>

  <path d="M 210 200 L 290 200" stroke="#94a3b8" stroke-width="4" stroke-dasharray="6" fill="none" />
  <polygon points="290,200 275,192 275,208" fill="#94a3b8" />

  <!-- Tier 2: WAS / Web Server -->
  <g transform="translate(300, 100)">
    <rect x="0" y="0" width="200" height="200" class="box" style="stroke: #3b82f6;" />
    <rect x="0" y="0" width="200" height="35" rx="6" fill="#3b82f6" />
    <text x="100" y="23" class="title">2 Tier: Application</text>
    
    <text x="100" y="70" class="name">WAS 웹/미들웨어</text>
    <text x="100" y="90" class="desc">(Nginx + PHP / Node.js)</text>
    
    <rect x="20" y="110" width="160" height="60" fill="#eff6ff" rx="4" />
    <text x="100" y="130" class="desc" fill="#1d4ed8" font-weight="bold">핵심 프로그래밍 로직</text>
    <text x="100" y="150" class="desc">ID/PW 검사, 결제 연동</text>
  </g>

  <path d="M 500 200 L 580 200" stroke="#94a3b8" stroke-width="4" stroke-dasharray="6" fill="none" />
  <polygon points="580,200 565,192 565,208" fill="#94a3b8" />

  <!-- Tier 3: Database -->
  <g transform="translate(590, 100)">
    <rect x="0" y="0" width="160" height="200" class="box" style="stroke: #eab308;" />
    <rect x="0" y="0" width="160" height="35" rx="6" fill="#eab308" />
    <text x="80" y="23" class="title">3 Tier: Data</text>
    
    <text x="80" y="70" class="name" fill="#a16207">데이터베이스</text>
    <text x="80" y="90" class="desc">(MySQL / MariaDB)</text>
    
    <rect x="10" y="110" width="140" height="60" fill="#fefce8" rx="4" />
    <text x="80" y="130" class="desc" fill="#854d0e" font-weight="bold">물리적 원본 데이터</text>
    <text x="80" y="150" class="desc">해킹 보호, 영구 저장</text>
  </g>

</svg>
