<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .unix { fill: #34495e; }
    .minix { fill: #7f8c8d; }
    .gnu { fill: #e67e22; }
    .linux { fill: #27ae60; }
    .gnulinux { fill: #2980b9; }
    .text-title { fill: white; font-family: sans-serif; font-weight: bold; font-size: 16px; text-anchor: middle; }
    .text-desc { fill: white; font-family: sans-serif; font-size: 12px; text-anchor: middle; }
    .year { fill: #333; font-family: sans-serif; font-weight: bold; font-size: 14px; text-anchor: middle; }
    
    .fade-in {
      opacity: 0;
      animation: fadeIn 3s forwards;
    }
    .delay-1 { animation-delay: 1s; }
    .delay-2 { animation-delay: 2s; }
    .delay-3 { animation-delay: 3s; }
    .delay-4 { animation-delay: 4s; }
    
    .arrow {
      stroke: #bdc3c7;
      stroke-width: 3;
      fill: none;
      stroke-dasharray: 5;
      animation: dash 1.5s linear infinite;
    }
    
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -10; }
    }
  </style>

  <rect width="100%" height="100%" fill="#f9f9f9" rx="10" />
  
  <text x="400" y="40" font-family="sans-serif" font-size="24" font-weight="bold" fill="#333" text-anchor="middle">리눅스와 오픈소스의 탄생 흐름 (Linux History)</text>
  
  <!-- 1969 UNIX -->
  <g class="fade-in">
    <rect x="50" y="80" width="160" height="80" rx="8" class="unix" />
    <text x="130" y="115" class="text-title">UNIX (1969)</text>
    <text x="130" y="140" class="text-desc">상용화된 강력한 OS</text>
    <text x="130" y="180" class="year">Bell Labs</text>
  </g>

  <!-- Arrow -->
  <g class="fade-in delay-1">
    <path d="M 210 120 L 290 120" class="arrow" />
    <polygon points="290,120 280,115 280,125" fill="#bdc3c7" />
  </g>

  <!-- 1987 MINIX -->
  <g class="fade-in delay-1">
    <rect x="300" y="80" width="160" height="80" rx="8" class="minix" />
    <text x="380" y="115" class="text-title">MINIX (1987)</text>
    <text x="380" y="140" class="text-desc">교육용 소형 유닉스</text>
    <text x="380" y="180" class="year">앤드류 타넨바움</text>
  </g>

  <!-- Arrow -->
  <g class="fade-in delay-2">
    <path d="M 460 120 L 540 120" class="arrow" />
    <polygon points="540,120 530,115 530,125" fill="#bdc3c7" />
  </g>

  <!-- 1991 LINUX -->
  <g class="fade-in delay-2">
    <rect x="550" y="80" width="160" height="80" rx="8" class="linux" />
    <text x="630" y="115" class="text-title">LINUX (1991)</text>
    <text x="630" y="140" class="text-desc">독립적 커널 개발</text>
    <text x="630" y="180" class="year">리누스 토르발스</text>
  </g>
  
  <!-- 1983 GNU -->
  <g class="fade-in delay-3">
    <rect x="150" y="240" width="160" height="80" rx="8" class="gnu" />
    <text x="230" y="275" class="text-title">GNU Project (1983)</text>
    <text x="230" y="300" class="text-desc">자유 소프트웨어 재단</text>
    <text x="230" y="340" class="year">리처드 스톨만</text>
  </g>

  <!-- Combine Arrows -->
  <g class="fade-in delay-4">
    <!-- From Linux down -->
    <path d="M 630 160 L 630 280 L 510 280" class="arrow" />
    <polygon points="510,280 520,275 520,285" fill="#bdc3c7" />
    <!-- From GNU right -->
    <path d="M 310 280 L 340 280" class="arrow" />
    <polygon points="340,280 330,275 330,285" fill="#bdc3c7" />
  </g>
  
  <!-- GNU/LINUX -->
  <g class="fade-in delay-4">
    <rect x="350" y="240" width="150" height="80" rx="8" class="gnulinux" />
    <text x="425" y="275" class="text-title">GNU/Linux</text>
    <text x="425" y="300" class="text-desc">완전한 오픈소스 OS</text>
    <text x="425" y="340" class="year">현재의 리눅스 배포판</text>
  </g>

</svg>
