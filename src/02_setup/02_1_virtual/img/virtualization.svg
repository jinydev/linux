<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <style>
    .hardware { fill: #34495e; }
    .os { fill: #e67e22; }
    .hypervisor { fill: #e74c3c; }
    .vm { fill: #2ecc71; stroke: #27ae60; stroke-width: 2; }
    .app { fill: #3498db; }
    .text-title { fill: #2c3e50; font-family: sans-serif; font-weight: bold; font-size: 20px; text-anchor: middle; }
    .text-box { fill: white; font-family: sans-serif; font-weight: bold; font-size: 16px; text-anchor: middle; alignment-baseline: middle; }
    .text-sub { fill: white; font-family: sans-serif; font-size: 12px; text-anchor: middle; alignment-baseline: middle; }
    
    .float {
      animation: float 3s ease-in-out infinite;
    }
    .delay-1 { animation-delay: 1s; }
    .delay-2 { animation-delay: 2s; }
    
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa" rx="15" />
  <text x="400" y="40" class="text-title" style="font-size:24px;">물리 서버 (Bare-Metal) vs 가상 머신 (Virtual Machine)</text>

  <!-- Bare Metal Side -->
  <g transform="translate(150, 100)">
    <text x="50" y="-15" class="text-title" style="font-size:18px;">전통적인 1:1 방식</text>
    
    <!-- Hardware -->
    <rect x="-50" y="280" width="200" height="60" rx="8" class="hardware" />
    <text x="50" y="315" class="text-box">물리 하드웨어 (서버 PC)</text>
    
    <!-- Host OS -->
    <rect x="-50" y="210" width="200" height="60" rx="8" class="os" />
    <text x="50" y="240" class="text-box">웹 서버 운영체제</text>
    <text x="50" y="260" class="text-sub">(리눅스 1개 설치)</text>
    
    <!-- Apps -->
    <rect x="-50" y="70" width="200" height="130" rx="8" class="app" />
    <text x="50" y="125" class="text-box">다양한 응용 프로그램</text>
    <text x="50" y="145" class="text-sub">(한 서버에서 모두 구동)</text>
    
    <!-- Line divider -->
    <line x1="200" y1="-20" x2="200" y2="350" stroke="#bdc3c7" stroke-width="2" stroke-dasharray="5" />
  </g>

  <!-- Virtualization Side -->
  <g transform="translate(500, 100)">
    <text x="50" y="-15" class="text-title" style="font-size:18px;">가상화 (Hypervisor) 방식</text>
    
    <!-- Hardware -->
    <rect x="-100" y="280" width="300" height="60" rx="8" class="hardware" />
    <text x="50" y="315" class="text-box">강력한 물리 하드웨어 (Host)</text>
    
    <!-- Hypervisor -->
    <rect x="-100" y="210" width="300" height="60" rx="8" class="hypervisor" />
    <text x="50" y="240" class="text-box">가상화 프로그램 (Hypervisor)</text>
    <text x="50" y="260" class="text-sub">(VirtualBox, VMWare 등)</text>
    
    <!-- VM 1 -->
    <g class="float" transform="translate(0, 0)">
      <rect x="-100" y="60" width="90" height="140" rx="8" class="vm" />
      <rect x="-90" y="70" width="70" height="50" rx="4" class="app" />
      <text x="-55" y="95" class="text-sub" style="font-weight:bold;">WEB 앱</text>
      <rect x="-90" y="130" width="70" height="60" rx="4" class="os" />
      <text x="-55" y="160" class="text-sub">우분투 1</text>
    </g>
    
    <!-- VM 2 -->
    <g class="float delay-1" transform="translate(0, 0)">
      <rect x="5" y="60" width="90" height="140" rx="8" class="vm" />
      <rect x="15" y="70" width="70" height="50" rx="4" class="app" />
      <text x="50" y="95" class="text-sub" style="font-weight:bold;">DB 앱</text>
      <rect x="15" y="130" width="70" height="60" rx="4" class="os" />
      <text x="50" y="160" class="text-sub">로키 1</text>
    </g>
    
    <!-- VM 3 -->
    <g class="float delay-2" transform="translate(0, 0)">
      <rect x="110" y="60" width="90" height="140" rx="8" class="vm" />
      <rect x="120" y="70" width="70" height="50" rx="4" class="app" />
      <text x="155" y="95" class="text-sub" style="font-weight:bold;">메일 앱</text>
      <rect x="120" y="130" width="70" height="60" rx="4" class="os" />
      <text x="155" y="160" class="text-sub">윈도우</text>
    </g>
  </g>

</svg>
