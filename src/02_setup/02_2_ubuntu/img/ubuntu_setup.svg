<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f4f6f9; rx: 15; }
    .host { fill: #34495e; rx: 8; }
    .vm { fill: #ecf0f1; stroke: #2c3e50; stroke-width: 2; stroke-dasharray: 5; rx: 8; }
    .iso { fill: #e67e22; rx: 4; }
    .ubuntu { fill: #e95420; rx: 8; }
    .text-title { fill: #2c3e50; font-family: sans-serif; font-weight: bold; font-size: 22px; text-anchor: middle; }
    .text-main { fill: white; font-family: sans-serif; font-weight: bold; font-size: 16px; text-anchor: middle; }
    .text-sub { fill: #333; font-family: sans-serif; font-size: 14px; text-anchor: middle; }
    
    .install-flow {
      animation: install 4s infinite ease-in-out;
    }
    
    .progress-bar {
      fill: #2ecc71;
      animation: progress 4s infinite linear;
    }
    
    @keyframes install {
      0% { transform: translate(0, -60px); opacity: 0; }
      15% { transform: translate(0, 0); opacity: 1; }
      85% { transform: translate(0, 0); opacity: 1; }
      100% { transform: translate(0, 0); opacity: 0; }
    }
    
    @keyframes progress {
      0% { width: 0; }
      20% { width: 0; }
      80% { width: 140px; }
      100% { width: 140px; }
    }
  </style>

  <rect width="100%" height="100%" class="bg" />
  
  <text x="400" y="40" class="text-title">가상머신(VM)에 OS를 설치하는 원리 개념도</text>

  <!-- Host PC -->
  <g transform="translate(400, 220)">
    <!-- Base structure -->
    <rect x="-240" y="-120" width="480" height="240" class="host" />
    <text x="-150" y="90" class="text-main">물리 컴퓨터 (Host PC)</text>
    
    <!-- VM Box -->
    <rect x="-100" y="-100" width="320" height="180" class="vm" />
    <text x="60" y="-70" class="text-sub" style="font-weight:bold; fill:white;">가상머신 (Virtual Machine)</text>
    <text x="60" y="-50" class="text-sub" style="fill:#bdc3c7; font-size:12px;">가상 CPU, 가상 메모리, 빈 가상 디스크</text>
    
    <!-- Installed Ubuntu Box (appears as progress finishes) -->
    <rect x="-80" y="-30" width="280" height="90" class="ubuntu" style="opacity: 0.8;" />
    <text x="60" y="10" class="text-main">Ubuntu 24.04 LTS 실행 중...</text>

    <!-- ISO Injection Animation -->
    <g class="install-flow">
      <!-- CD / ISO image -->
      <rect x="-300" y="-30" width="120" height="40" class="iso" />
      <text x="-240" y="-5" class="text-main" style="font-size:14px;">ubuntu.iso</text>
      
      <!-- Arrow -->
      <path d="M -170 -10 L -100 -10" stroke="#e67e22" stroke-width="4" stroke-dasharray="4" fill="none" />
      <polygon points="-100,-10 -110,-16 -110,-4" fill="#e67e22" />
      
      <!-- Progress Bar Overlay inside Ubuntu box dummy -->
      <rect x="-20" y="30" width="140" height="10" fill="#34495e" rx="5" />
      <rect x="-20" y="30" height="10" class="progress-bar" rx="5" />
      <text x="50" y="20" class="text-sub" style="fill:white; font-size:12px;">가상 디스크에 설치 진행</text>
    </g>

  </g>

</svg>
