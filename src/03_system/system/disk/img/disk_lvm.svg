<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f0f4f8; rx: 15; }
    .physical { fill: #95a5a6; stroke: #7f8c8d; stroke-width: 2; rx: 6; }
    .partition { fill: #34495e; rx: 4; }
    .lvm { fill: #2c3e50; }
    .logical { fill: #3498db; stroke: #2980b9; stroke-width: 2; rx: 4; }
    .filesystem { fill: #2ecc71; rx: 4; }
    
    .text-title { fill: #2c3e50; font-family: sans-serif; font-weight: bold; font-size: 22px; text-anchor: middle; }
    .text-main { fill: white; font-family: sans-serif; font-weight: bold; font-size: 14px; text-anchor: middle; alignment-baseline: middle; }
    .text-label { fill: #34495e; font-family: sans-serif; font-weight: bold; font-size: 14px; text-anchor: middle; }
    
    .flow {
      stroke: #e67e22;
      stroke-width: 4;
      stroke-dasharray: 8;
      fill: none;
      animation: dash 1.5s linear infinite;
    }

    @keyframes dash {
      to { stroke-dashoffset: -16; }
    }

    .pulse {
      animation: pulse 3s infinite ease-in-out;
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes pulse {
      0% { transform: translateY(0px); filter: brightness(1); }
      50% { transform: translateY(-3px); filter: brightness(1.2); }
      100% { transform: translateY(0px); filter: brightness(1); }
    }
  </style>

  <rect width="100%" height="100%" class="bg" />
  
  <text x="400" y="40" class="text-title">디스크 파티셔닝과 LVM (논리 볼륨) 구조</text>
  
  <!-- Physical Layer -->
  <g transform="translate(150, 320)">
    <rect x="-100" y="0" width="200" height="80" class="physical" />
    <text x="0" y="-15" class="text-label">물리적 하드 디스크 1 (500GB)</text>
    
    <!-- Partitions inside Physical Disk 1 -->
    <rect x="-90" y="10" width="80" height="60" class="partition" />
    <text x="-50" y="45" class="text-main">/boot (1G)</text>
    
    <rect x="0" y="10" width="90" height="60" class="partition" />
    <text x="45" y="45" class="text-main">LVM (499G)</text>
  </g>

  <g transform="translate(650, 320)">
    <rect x="-100" y="0" width="200" height="80" class="physical" />
    <text x="0" y="-15" class="text-label">물리적 하드 디스크 2 (500GB)</text>
    
    <!-- Partitions inside Physical Disk 2 -->
    <rect x="-90" y="10" width="180" height="60" class="partition" />
    <text x="0" y="45" class="text-main">LVM (500G)</text>
  </g>

  <!-- Flow Arrows combining LVM -->
  <path d="M 195 310 L 195 250 L 400 250 L 400 220" class="flow" />
  <path d="M 650 310 L 650 250 L 400 250 L 400 220" class="flow" />

  <!-- Logical Layer (LVM Pool) -->
  <g transform="translate(400, 160)" class="pulse">
    <rect x="-240" y="0" width="480" height="60" class="lvm" rx="8" />
    <text x="0" y="35" class="text-main" style="font-size:16px;">VGB (볼륨 그룹) - 총 999GB 가상 공간 병합!</text>
  </g>

  <!-- Flow Arrows distributing Logic -->
  <path d="M 400 150 L 400 120 L 250 120 L 250 100" stroke="#7f8c8d" stroke-width="3" fill="none" />
  <path d="M 400 150 L 400 120 L 550 120 L 550 100" stroke="#7f8c8d" stroke-width="3" fill="none" />

  <!-- File System Layer -->
  <g transform="translate(250, 40)">
    <rect x="-100" y="0" width="200" height="60" class="logical" />
    <rect x="-90" y="10" width="180" height="40" class="filesystem" />
    <text x="0" y="35" class="text-main">/ (루트) - xfs (100GB)</text>
  </g>
  
  <g transform="translate(550, 40)">
    <rect x="-100" y="0" width="200" height="60" class="logical" />
    <rect x="-90" y="10" width="180" height="40" class="filesystem" />
    <text x="0" y="35" class="text-main">/home - ext4 (899GB)</text>
  </g>

</svg>
