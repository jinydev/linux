<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f8fafc; rx: 12px; }
    .box { stroke-width: 2px; rx: 8px; }
    .deb-box { fill: #fff1f2; stroke: #e11d48; }
    .rpm-box { fill: #eff6ff; stroke: #2563eb; }
    
    .text-title { fill: #0f172a; font-family: sans-serif; font-weight: bold; font-size: 24px; text-anchor: middle; }
    .text-main { font-family: sans-serif; font-weight: bold; font-size: 20px; text-anchor: middle; alignment-baseline: middle; }
    .text-sub { fill: #475569; font-family: sans-serif; font-size: 14px; text-anchor: middle; }
    .badge { fill: white; font-family: monospace; font-size: 14px; font-weight: bold; text-anchor: middle; }
  </style>

  <rect width="100%" height="100%" class="bg" />
  <text x="400" y="40" class="text-title">리눅스 2대 패키지 매니지먼트 계열 구조도</text>

  <!-- Debian Side -->
  <g transform="translate(150, 100)">
    <rect x="0" y="0" width="220" height="200" class="box deb-box" />
    <text x="110" y="35" class="text-main" fill="#be123c">데비안 (Debian) 계열</text>
    
    <!-- OS info -->
    <rect x="35" y="55" width="150" height="25" fill="#e11d48" rx="12" />
    <text x="110" y="72" class="badge">Ubuntu, Linux Mint</text>

    <!-- Package core -->
    <text x="110" y="115" class="text-sub" font-weight="bold">Core 패키징 방식</text>
    <text x="110" y="135" class="text-main" fill="#881337" font-size="16px">dpkg (*.deb)</text>

    <!-- Network downloader -->
    <text x="110" y="165" class="text-sub" font-weight="bold">고급 자동화 매니저</text>
    <text x="110" y="185" class="text-main" fill="#e11d48">APT (apt-get)</text>
  </g>

  <!-- RedHat Side -->
  <g transform="translate(430, 100)">
    <rect x="0" y="0" width="220" height="200" class="box rpm-box" />
    <text x="110" y="35" class="text-main" fill="#1d4ed8">레드햇 (RedHat) 계열</text>
    
    <!-- OS info -->
    <rect x="35" y="55" width="150" height="25" fill="#2563eb" rx="12" />
    <text x="110" y="72" class="badge">Rocky, CentOS, RHEL</text>

    <!-- Package core -->
    <text x="110" y="115" class="text-sub" font-weight="bold">Core 패키징 방식</text>
    <text x="110" y="135" class="text-main" fill="#1e3a8a" font-size="16px">rpm (*.rpm)</text>

    <!-- Network downloader -->
    <text x="110" y="165" class="text-sub" font-weight="bold">고급 자동화 매니저</text>
    <text x="110" y="185" class="text-main" fill="#2563eb">YUM / DNF</text>
  </g>

  <!-- vs symbol -->
  <circle cx="400" cy="200" r="20" fill="#334155" />
  <text x="400" y="206" fill="white" font-family="sans-serif" font-weight="bold" font-size="18px" text-anchor="middle">VS</text>

</svg>
