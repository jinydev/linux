<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f8fafc; }
    .box { fill: white; stroke-width: 2px; rx: 8px; stroke: #334155; }
    
    .head { fill: #0f172a; font-family: sans-serif; font-weight: bold; font-size: 24px; text-anchor: middle; }
    .txt { fill: #1e293b; font-family: sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
    .desc { fill: #64748b; font-family: sans-serif; font-size: 13px; text-anchor: middle; }
    
    .cron-box { fill: #fefce8; stroke: #ca8a04; }
    .job-box { stroke: #3b82f6; fill: #eff6ff; }
    
    .arrow { stroke: #94a3b8; stroke-width: 4px; fill: none; }
  </style>

  <rect width="100%" height="100%" class="bg" rx="15" />
  <text x="400" y="40" class="head">리눅스 자동화 비서 - Cron 요정(Daemon) 스케줄링 구조도</text>

  <!-- Crontab Config -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="180" height="180" class="box" />
    <rect x="0" y="0" width="180" height="40" rx="6" fill="#334155" />
    <text x="90" y="26" class="txt" fill="white">작업 지시서 (crontab)</text>
    
    <text x="90" y="80" class="desc" fill="#b91c1c" font-weight="bold" font-size="16px">0 3 * * 1 (매주 월 새벽3시)</text>
    <text x="90" y="105" class="desc" fill="#0f172a">백업 스크립트 실행해라!</text>
    
    <rect x="20" y="130" width="140" height="30" fill="#f1f5f9" rx="4" />
    <text x="90" y="150" class="desc">사용자가 타이핑 등록</text>
  </g>

  <!-- Cron Daemon (Center) -->
  <g transform="translate(400, 190)">
    <circle cx="0" cy="0" r="60" class="cron-box" stroke-width="4" stroke-dasharray="8" />
    <text x="0" y="-5" class="txt" fill="#a16207">Cron 데몬</text>
    <text x="0" y="15" class="desc">(죽지않고 감시)</text>
  </g>

  <!-- Arrows to Cron -->
  <path d="M 280 190 L 330 190" class="arrow" stroke-dasharray="6" />
  <polygon points="330,190 320,180 320,200" fill="#94a3b8" />
  <text x="310" y="170" class="desc" font-weight="bold">명령 접수</text>

  <!-- Execution Arrows to Jobs -->
  <path d="M 470 190 L 520 190" class="arrow" stroke="#3b82f6" />
  <polygon points="520,190 510,180 510,200" fill="#3b82f6" />
  <text x="495" y="170" class="desc" font-weight="bold" fill="#1d4ed8">시간 도달 시 발사!</text>

  <!-- Jobs executed -->
  <g transform="translate(530, 80)">
    <rect x="0" y="0" width="200" height="50" class="box job-box" />
    <text x="100" y="22" class="txt" fill="#1e40af">DB 영구 백업 실행</text>
    <text x="100" y="40" class="desc">(mysqldump 생성)</text>
    
    <rect x="0" y="80" width="200" height="50" class="box job-box" />
    <text x="100" y="102" class="txt" fill="#1e40af">이전 로그 파일 삭제</text>
    <text x="100" y="120" class="desc">(휴지통 비우기)</text>
    
    <rect x="0" y="160" width="200" height="50" class="box job-box" />
    <text x="100" y="182" class="txt" fill="#1e40af">결제 정산 이메일 전송</text>
    <text x="100" y="200" class="desc">(사장님께 월말 보고)</text>
  </g>

</svg>
