<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f8fafc; rx: 12px; }
    .box { stroke-width: 2px; rx: 8px; }
    .root-box { fill: #fef2f2; stroke: #ef4444; }
    .normal-box { fill: #eff6ff; stroke: #3b82f6; }
    .svc-box { fill: #f0fdf4; stroke: #10b981; }
    
    .title { fill: #0f172a; font-family: sans-serif; font-weight: bold; font-size: 24px; text-anchor: middle; }
    .text-head { font-family: sans-serif; font-weight: bold; font-size: 18px; text-anchor: middle; alignment-baseline: middle; }
    .text-body { fill: #475569; font-family: sans-serif; font-size: 13px; text-anchor: middle; }
    .badge { fill: white; font-family: monospace; font-size: 12px; font-weight: bold; text-anchor: middle; }
  </style>

  <rect width="100%" height="100%" class="bg" />
  <text x="400" y="40" class="title">리눅스 사용자(User) 3대 유형 구조도</text>

  <!-- Root User -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="180" height="150" class="box root-box" />
    <text x="90" y="30" class="text-head" style="fill: #b91c1c;">슈퍼 사용자</text>
    <text x="90" y="55" class="text-body" style="font-weight: bold;">(Root)</text>
    
    <rect x="30" y="70" width="120" height="20" fill="#ef4444" rx="4" />
    <text x="90" y="84" class="badge">모든 권한 통제</text>
    
    <text x="90" y="115" class="text-body">시스템 전체 변경</text>
    <text x="90" y="135" class="text-body">삭제/추가 제어 가능</text>
  </g>

  <!-- Normal User -->
  <g transform="translate(310, 100)">
    <rect x="0" y="0" width="180" height="150" class="box normal-box" />
    <text x="90" y="30" class="text-head" style="fill: #1d4ed8;">일반 사용자</text>
    <text x="90" y="55" class="text-body" style="font-weight: bold;">(Normal User)</text>
    
    <rect x="30" y="70" width="120" height="20" fill="#3b82f6" rx="4" />
    <text x="90" y="84" class="badge">개인 공간 할당</text>
    
    <text x="90" y="115" class="text-body">/home 내에서만 활동</text>
    <text x="90" y="135" class="text-body">기본적인 문서 작업</text>
  </g>
  
  <!-- Service Account -->
  <g transform="translate(520, 100)">
    <rect x="0" y="0" width="180" height="150" class="box svc-box" />
    <text x="90" y="30" class="text-head" style="fill: #047857;">서비스 계정</text>
    <text x="90" y="55" class="text-body" style="font-weight: bold;">(Service Account)</text>
    
    <rect x="30" y="70" width="120" height="20" fill="#10b981" rx="4" />
    <text x="90" y="84" class="badge">백그라운드 전용</text>
    
    <text x="90" y="115" class="text-body">로그인 불가 (Nologin)</text>
    <text x="90" y="135" class="text-body">웹, DB 구동용 역할</text>
  </g>

  <text x="400" y="300" class="text-body" style="font-size: 15px; font-weight: bold;">대부분의 사용자 보안은 "일반 사용자"로 로그인 후 필요할 때만 sudo 명령어를 치는 것으로 시작됩니다.</text>
</svg>
