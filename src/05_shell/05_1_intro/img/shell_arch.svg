<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f8fafc; }
    .hardware { fill: #94a3b8; stroke: #64748b; stroke-width: 2px; }
    .kernel { fill: #ef4444; stroke: #b91c1c; stroke-width: 2px; }
    .shell { fill: #3b82f6; stroke: #1d4ed8; stroke-width: 2px; }
    .user { fill: #10b981; stroke: #047857; stroke-width: 2px; }
    
    .text-title { fill: #0f172a; font-family: sans-serif; font-weight: bold; font-size: 24px; text-anchor: middle; }
    .text-main { fill: white; font-family: sans-serif; font-weight: bold; font-size: 18px; text-anchor: middle; alignment-baseline: middle; }
    .text-sub { fill: white; font-family: sans-serif; font-size: 13px; text-anchor: middle; }
    
    .line { stroke: #64748b; stroke-width: 3px; fill: none; stroke-dasharray: 4; }
  </style>

  <rect width="100%" height="100%" class="bg" rx="15" />
  <text x="400" y="40" class="text-title">쉘(Shell) 시스템 아키텍처 및 역할</text>
  
  <!-- Outer Layer: User -->
  <rect x="100" y="80" width="600" height="280" rx="15" class="user" opacity="0.9" />
  <text x="400" y="110" class="text-main">4. 사용자 (User &amp; Applications)</text>
  <text x="400" y="130" class="text-sub">명령어 입력 (ex: ls, pwd)</text>

  <!-- Shell Layer -->
  <rect x="150" y="150" width="500" height="190" rx="15" class="shell" opacity="0.95" />
  <text x="400" y="180" class="text-main">3. 쉘 (Shell : bash, zsh, csh)</text>
  <text x="400" y="200" class="text-sub">명령어 해석기 (Command Interpreter)</text>

  <!-- Kernel Layer -->
  <rect x="200" y="220" width="400" height="100" rx="15" class="kernel" />
  <text x="400" y="250" class="text-main">2. 커널 (Kernel)</text>
  <text x="400" y="270" class="text-sub">자원 분배 및 하드웨어 통제</text>

  <!-- Hardware Layer -->
  <rect x="250" y="290" width="300" height="50" rx="15" class="hardware" />
  <text x="400" y="320" class="text-main" style="fill:#1e293b;">1. 하드웨어 (CPU, RAM, Disk)</text>

  <!-- Connection Arrows to show mapping -->
  <!-- User to Shell -->
  <path d="M 400 135 L 400 150" class="line" />
  <!-- Shell to Kernel -->
  <path d="M 400 205 L 400 220" class="line" stroke="white" />
  <!-- Kernel to Hardware -->
  <path d="M 400 275 L 400 290" class="line" stroke="white" />
  
</svg>
