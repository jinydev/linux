<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f8fafc; rx: 12px; }
    .box { fill: white; stroke: #94a3b8; stroke-width: 2px; rx: 8px; }
    
    .head { fill: #0f172a; font-family: sans-serif; font-weight: bold; font-size: 24px; text-anchor: middle; }
    .step-num { fill: #f8fafc; font-weight: bold; font-family: sans-serif; font-size: 14px; text-anchor: middle; alignment-baseline: middle; }
    .step-name { fill: #1e293b; font-weight: bold; font-family: monospace; font-size: 18px; text-anchor: middle; }
    .step-desc { fill: #64748b; font-family: sans-serif; font-size: 13px; text-anchor: middle; }
    
    .arrow { stroke: #3b82f6; stroke-width: 4px; fill: none; stroke-dasharray: 4; }
  </style>

  <rect width="100%" height="100%" class="bg" />
  <text x="400" y="40" class="head">리눅스 수동 컴파일(Compile) 빌드 3단계 절차</text>

  <!-- Step 1: Configure -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="160" height="120" class="box" />
    <circle cx="80" cy="0" r="15" fill="#3b82f6" />
    <text x="80" y="5" class="step-num">1</text>
    
    <text x="80" y="45" class="step-name">./configure</text>
    <text x="80" y="70" class="step-desc">환경 설정 및 파일 생성</text>
    <text x="80" y="90" class="step-desc">(Makefile 생성 단계)</text>
  </g>

  <!-- Arrow -->
  <path d="M 270 160 L 320 160" class="arrow" />
  <polygon points="320,160 310,154 310,166" fill="#3b82f6" />

  <!-- Step 2: Make -->
  <g transform="translate(330, 100)">
    <rect x="0" y="0" width="160" height="120" class="box" style="stroke: #eab308; stroke-width: 3px;" />
    <circle cx="80" cy="0" r="15" fill="#eab308" />
    <text x="80" y="5" class="step-num">2</text>
    
    <text x="80" y="45" class="step-name">make</text>
    <text x="80" y="70" class="step-desc">코드 → 기계어 번역</text>
    <text x="80" y="90" class="step-desc">(실질적인 컴파일 단계)</text>
  </g>

  <!-- Arrow -->
  <path d="M 500 160 L 550 160" class="arrow" />
  <polygon points="550,160 540,154 540,166" fill="#3b82f6" />

  <!-- Step 3: Make Install -->
  <g transform="translate(560, 100)">
    <rect x="0" y="0" width="160" height="120" class="box" style="stroke: #10b981; stroke-width: 3px;" />
    <circle cx="80" cy="0" r="15" fill="#10b981" />
    <text x="80" y="5" class="step-num">3</text>
    
    <text x="80" y="45" class="step-name">make install</text>
    <text x="80" y="70" class="step-desc">실행 파일을</text>
    <text x="80" y="90" class="step-desc">/usr/bin 에 최종 배치</text>
  </g>

  <rect x="150" y="270" width="500" height="40" fill="#f1f5f9" rx="4" />
  <text x="400" y="295" fill="#475569" font-family="sans-serif" font-weight="bold" font-size="14px" text-anchor="middle">요즘은 자동화 툴(APT/DNF)의 발달로 이 수동 과정을 겪을 일이 매우 적어졌습니다.</text>

</svg>
