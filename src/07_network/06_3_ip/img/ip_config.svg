<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f8fafc; }
    .box { fill: white; stroke-width: 2px; rx: 8px; }
    
    .head { fill: #0f172a; font-family: sans-serif; font-weight: bold; font-size: 24px; text-anchor: middle; }
    .title { fill: white; font-family: sans-serif; font-weight: bold; font-size: 18px; text-anchor: middle; }
    .desc { fill: #475569; font-family: monospace; font-size: 14px; font-weight: bold; text-anchor: middle; }
    .info { fill: #64748b; font-family: sans-serif; font-size: 14px; text-anchor: middle; }
    
    .dhcp-box { stroke: #3b82f6; }
    .static-box { stroke: #ef4444; }
  </style>

  <rect width="100%" height="100%" class="bg" rx="15" />
  <text x="400" y="40" class="head">리눅스 IP 할당 2가지 방식 비교 (DHCP vs Static)</text>

  <!-- DHCP -->
  <g transform="translate(150, 100)">
    <rect x="0" y="0" width="220" height="200" class="box dhcp-box" />
    <rect x="0" y="0" width="220" height="40" fill="#3b82f6" rx="8" />
    <text x="110" y="26" class="title">동적 IP 할당 (DHCP)</text>
    
    <text x="110" y="80" class="desc" fill="#1d4ed8">IP 임대 정책</text>
    <text x="110" y="110" class="info">공유기(라우터)가 남는</text>
    <text x="110" y="130" class="info">IP를 알아서 꽂아줌</text>
    <text x="110" y="160" class="info" fill="#3b82f6" font-weight="bold">재부팅 시 IP가 바뀔 수 있음!</text>
    <text x="110" y="180" class="info" font-size="12px">PC, 스마트폰 등에 주로 씀</text>
  </g>

  <!-- Static IP -->
  <g transform="translate(430, 100)">
    <rect x="0" y="0" width="220" height="200" class="box static-box" />
    <rect x="0" y="0" width="220" height="40" fill="#ef4444" rx="8" />
    <text x="110" y="26" class="title">고정 IP 할당 (Static)</text>
    
    <text x="110" y="80" class="desc" fill="#b91c1c">IP 점유 정책</text>
    <text x="110" y="110" class="info">엔지니어가 직접 야믈(yaml)</text>
    <text x="110" y="130" class="info">파일로 IP를 수동 못박음</text>
    <text x="110" y="160" class="info" fill="#ef4444" font-weight="bold">서버 주소가 영구 불변함!</text>
    <text x="110" y="180" class="info" font-size="12px">외부 서비스 웹서버용 필수</text>
  </g>

  <!-- Arrow/VS -->
  <circle cx="400" cy="200" r="20" fill="#334155" />
  <text x="400" y="206" fill="white" font-family="sans-serif" font-weight="bold" font-size="16px" text-anchor="middle">VS</text>

</svg>
