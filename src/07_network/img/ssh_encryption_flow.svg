<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <style>
      .bg { fill: #1c1917; }
      .text-title { fill: #fafaf9; font-family: 'Inter', sans-serif; font-size: 22px; font-weight: bold; }
      .text-sub { fill: #a8a29e; font-family: 'Inter', sans-serif; font-size: 14px; }
      .text-node { fill: #ffffff; font-family: 'Inter', sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle;}
      .client-box { fill: #292524; stroke: #3b82f6; stroke-width: 2; }
      .server-box { fill: #292524; stroke: #10b981; stroke-width: 2; }
      .key-public { fill: #fbbf24; }
      .key-private { fill: #f43f5e; }
      .tunnel { fill: rgba(14, 165, 233, 0.2); stroke: #0ea5e9; stroke-width: 2; stroke-dasharray: 4,4; }
      .arrow { stroke: #0ea5e9; stroke-width: 3; fill: none; }
    </style>
    <marker id="arrow-head" orient="auto" markerWidth="6" markerHeight="6" refX="5" refY="3">
      <path d="M0,0 V6 L6,3 Z" fill="#0ea5e9" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="10" />

  <text x="400" y="45" class="text-title" text-anchor="middle">SSH Secure Tunneling (Port 22)</text>
  <text x="400" y="70" class="text-sub" text-anchor="middle">Client (Putty/Terminal) to Linux Server via Public Key Cryptography</text>

  <!-- Secure Tunnel -->
  <rect x="250" y="160" width="300" height="80" rx="15" class="tunnel" />
  <text x="400" y="205" class="text-node" style="fill: #38bdf8;">Encrypted Secure Tunnel</text>

  <!-- Client -->
  <rect x="50" y="120" width="200" height="160" rx="10" class="client-box" />
  <text x="150" y="160" class="text-node">Client PC</text>
  <text x="150" y="180" class="text-sub" style="font-size:12px;" text-anchor="middle">(Windows / Mac)</text>
  
  <rect x="70" y="220" width="160" height="40" rx="5" fill="#3f3f46" />
  <text x="150" y="245" class="text-node" style="font-size:14px; fill:#fbbf24">Private Key (Secret)</text>

  <!-- Server -->
  <rect x="550" y="120" width="200" height="160" rx="10" class="server-box" />
  <text x="650" y="160" class="text-node">Linux Server</text>
  <text x="650" y="180" class="text-sub" style="font-size:12px;" text-anchor="middle">(Ubuntu / CentOS)</text>
  
  <rect x="570" y="220" width="160" height="40" rx="5" fill="#3f3f46" />
  <text x="650" y="245" class="text-node" style="font-size:14px; fill:#34d399">Public Key (Authorized)</text>

  <!-- Flow Arrows -->
  <path d="M 260 200 L 530 200" class="arrow" marker-end="url(#arrow-head)" />

  <text x="400" y="340" class="text-sub" text-anchor="middle">네트워크 상에서 스니핑(Sniffing)이 불가능하도록 데이터를 강력하게 암호화하여 통신합니다.</text>
</svg>
