<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f8fafc; }
    .box { fill: white; stroke-width: 2px; rx: 8px; stroke: #cbd5e1; }
    
    .head { fill: #0f172a; font-family: sans-serif; font-weight: bold; font-size: 24px; text-anchor: middle; }
    .txt { fill: #1e293b; font-family: sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
    .desc { fill: #64748b; font-family: sans-serif; font-size: 13px; text-anchor: middle; }
    
    .apache-box { stroke: #ef4444; fill: #fef2f2; }
    .thread { fill: #fca5a5; rx: 4px; }
  </style>

  <rect width="100%" height="100%" class="bg" rx="15" />
  <text x="400" y="40" class="head">Apache 웹 서버의 쓰레드(Thread) 생성 결함 구조</text>

  <!-- Requests -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="20" fill="#cbd5e1" />
    <text x="0" y="5" font-family="sans-serif" font-weight="bold" text-anchor="middle">접속 1</text>
    
    <circle cx="0" cy="50" r="20" fill="#cbd5e1" />
    <text x="0" y="55" font-family="sans-serif" font-weight="bold" text-anchor="middle">접속 2</text>
    
    <circle cx="0" cy="100" r="20" fill="#cbd5e1" />
    <text x="0" y="105" font-family="sans-serif" font-weight="bold" text-anchor="middle">접속 3</text>
    
    <circle cx="0" cy="160" r="20" fill="#cbd5e1" />
    <text x="0" y="165" fill="#ef4444" font-family="sans-serif" font-weight="bold" text-anchor="middle">1만 접속</text>
  </g>

  <!-- Arrows -->
  <path d="M 130 100 L 250 100" stroke="#94a3b8" stroke-width="4" stroke-dasharray="4" fill="none" />
  <path d="M 130 150 L 250 150" stroke="#94a3b8" stroke-width="4" stroke-dasharray="4" fill="none" />
  <path d="M 130 200 L 250 200" stroke="#94a3b8" stroke-width="4" stroke-dasharray="4" fill="none" />
  <path d="M 130 260 L 250 260" stroke="#ef4444" stroke-width="4" stroke-dasharray="4" fill="none" />

  <!-- Apache Server Box -->
  <g transform="translate(280, 80)">
    <rect x="0" y="0" width="400" height="220" class="box apache-box" />
    <text x="200" y="30" class="txt" fill="#b91c1c">Apache 프로세스 엔진</text>
    
    <!-- Thread boxes inside Apache -->
    <!-- Connection 1 -->
    <rect x="20" y="50" width="360" height="30" class="thread" />
    <text x="200" y="70" class="txt" fill="#7f1d1d">독립 쓰레드 생성 (메모리 독식)</text>
    
    <!-- Connection 2 -->
    <rect x="20" y="90" width="360" height="30" class="thread" />
    <text x="200" y="110" class="txt" fill="#7f1d1d">독립 쓰레드 생성 (메모리 독식)</text>
    
    <!-- Connection 3 -->
    <rect x="20" y="130" width="360" height="30" class="thread" />
    <text x="200" y="150" class="txt" fill="#7f1d1d">독립 쓰레드 생성 (메모리 독식)</text>
    
    <!-- Crash -->
    <rect x="20" y="170" width="360" height="40" fill="#ef4444" rx="4" />
    <text x="200" y="195" fill="white" font-family="sans-serif" font-weight="bold" font-size="16px" text-anchor="middle">메모리 고갈로 인한 서버 폭파 현상 (C10K 문제)</text>
  </g>

</svg>
