<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f8fafc; }
    .box { fill: white; stroke-width: 2px; rx: 8px; stroke: #cbd5e1; }
    
    .head { fill: #0f172a; font-family: sans-serif; font-weight: bold; font-size: 24px; text-anchor: middle; }
    .txt { fill: #1e293b; font-family: sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
    .code { fill: #10b981; font-family: monospace; font-size: 14px; font-weight: bold; text-anchor: middle; }
    
    .arrow { stroke: #3b82f6; stroke-width: 4px; stroke-dasharray: 6; fill: none; }
  </style>

  <rect width="100%" height="100%" class="bg" rx="15" />
  <text x="400" y="40" class="head">웹 서버(Web Server) 통신 기본 원리도</text>

  <!-- Client -->
  <g transform="translate(80, 150)">
    <rect x="-60" y="-40" width="120" height="80" class="box" stroke="#3b82f6" />
    <text x="0" y="-10" class="txt">손님 (Client)</text>
    <text x="0" y="15" class="code" fill="#64748b">크롬 브라우저</text>
  </g>

  <!-- Request Arrow -->
  <path d="M 150 130 L 320 130" class="arrow" />
  <polygon points="320,130 305,120 305,140" fill="#3b82f6" />
  <text x="235" y="115" class="code">HTTP Request</text>

  <!-- Response Arrow -->
  <path d="M 320 170 L 150 170" class="arrow" stroke="#10b981" />
  <polygon points="150,170 165,160 165,180" fill="#10b981" />
  <text x="235" y="200" class="code" fill="#059669">HTTP Response (HTML)</text>

  <!-- Web Server -->
  <g transform="translate(420, 150)">
    <rect x="-80" y="-80" width="160" height="160" class="box" fill="#1e293b" stroke="#0f172a" />
    <text x="0" y="-40" class="txt" fill="white">리눅스 웹 서버</text>
    
    <!-- Apache/Nginx Process -->
    <rect x="-60" y="-20" width="120" height="40" fill="#3b82f6" rx="4" />
    <text x="0" y="5" class="txt" fill="white">Apache / Nginx</text>
    
    <rect x="-60" y="30" width="120" height="30" fill="#334155" rx="4" />
    <text x="0" y="50" class="code" fill="#cbd5e1" font-size="12px">Port: 80 / 443</text>
  </g>

  <!-- Storage -->
  <g transform="translate(680, 150)">
    <rect x="-60" y="-40" width="120" height="80" class="box" stroke="#eab308" />
    <text x="0" y="-10" class="txt">하드디스크</text>
    <text x="0" y="15" class="code" fill="#64748b">index.html</text>
  </g>

  <path d="M 510 150 L 610 150" class="arrow" stroke="#94a3b8" />
  <polygon points="610,150 600,140 600,160" fill="#94a3b8" />
  <path d="M 610 160 L 510 160" class="arrow" stroke="#94a3b8" />
  
  <rect x="150" y="270" width="500" height="40" fill="#f1f5f9" rx="4" />
  <text x="400" y="295" fill="#475569" font-family="sans-serif" font-weight="bold" font-size="14px" text-anchor="middle">웹 서버는 하드디스크의 텍스트(HTML) 파일을 읽어 웹 브라우저 화면에 뿌려주는 종업원입니다.</text>
</svg>
